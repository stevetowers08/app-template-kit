<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Template Switcher</title>
<style>
  :root {
    --bg: #f7f7f8; --panel: #ffffff; --text: #18181b; --muted: #71717a; --border: #e4e4e7;
    --active: #eef0ff; --accent: #2540e8; --ok: #15803d; --warn: #b45309; --bad: #b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0b0d; --panel: #141417; --text: #f4f4f5; --muted: #a1a1aa; --border: #27272a;
      --active: #1c1f3a; --accent: #8b9bff; --ok: #4ade80; --warn: #fbbf24; --bad: #f87171;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; grid-template-columns: 280px 1fr; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  aside { border-right: 1px solid var(--border); background: var(--panel); overflow-y: auto; }
  aside header { padding: 16px; border-bottom: 1px solid var(--border); }
  aside h1 { font-size: 15px; margin: 0 0 4px; }
  aside p { margin: 0; color: var(--muted); font-size: 12px; }
  nav button {
    display: block; width: 100%; text-align: left; border: 0; background: none; color: inherit;
    padding: 10px 16px; cursor: pointer; font: inherit; border-bottom: 1px solid var(--border);
  }
  nav button:hover { background: var(--bg); }
  nav button[aria-current="true"] { background: var(--active); box-shadow: inset 3px 0 var(--accent); }
  nav strong { display: block; font-weight: 600; }
  nav span {
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    color: var(--muted); font-size: 12px;
  }
  main { display: grid; grid-template-rows: auto 1fr; min-width: 0; }
  .bar {
    display: flex; align-items: center; gap: 12px; padding: 10px 16px; min-height: 49px;
    border-bottom: 1px solid var(--border); background: var(--panel);
  }
  .bar h2 { font-size: 14px; margin: 0; }
  .bar .spacer { flex: 1; }
  .bar a { color: var(--accent); font-size: 13px; text-decoration: none; }
  .bar a:hover { text-decoration: underline; }
  .pill { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; }
  .pill.ready { color: var(--ok); } .pill.starting, .pill.installing { color: var(--warn); }
  .pill.error { color: var(--bad); }
  .stage { position: relative; min-height: 0; }
  iframe { width: 100%; height: 100%; border: 0; background: var(--panel); display: block; }
  .overlay {
    position: absolute; inset: 0; display: grid; place-content: center; gap: 12px; padding: 24px;
    background: var(--bg); text-align: center;
  }
  .overlay[hidden] { display: none; }
  .overlay pre {
    text-align: left; max-width: 760px; max-height: 40vh; overflow: auto; margin: 0; padding: 12px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px; font-size: 12px;
    white-space: pre-wrap;
  }
  .overlay button {
    justify-self: center; font: inherit; padding: 6px 14px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
  }
  @media (max-width: 720px) {
    body { grid-template-columns: 1fr; grid-template-rows: 40vh 1fr; }
    aside { border-right: 0; border-bottom: 1px solid var(--border); }
  }
</style>
</head>
<body>
<aside>
  <header>
    <h1>Template Switcher</h1>
    <p id="summary">Loading apps...</p>
  </header>
  <nav id="list"></nav>
</aside>
<main>
  <div class="bar">
    <h2 id="title">Pick an app</h2>
    <span id="status" class="pill" hidden></span>
    <span class="spacer"></span>
    <a id="open" target="_blank" rel="noopener" hidden>Open in new tab</a>
    <a id="demo" target="_blank" rel="noopener" hidden>Hosted demo</a>
  </div>
  <div class="stage">
    <iframe id="frame" title="Selected app"></iframe>
    <div id="overlay" class="overlay">
      <div id="message">Choose an app on the left. It starts on demand; the first load takes a few seconds.</div>
      <pre id="log" hidden></pre>
      <button id="retry" type="button" hidden>Retry</button>
    </div>
  </div>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const STATUS_TEXT = { installing: "Installing dependencies", starting: "Starting", ready: "Running", error: "Failed" };
  let apps = [];
  let selected = null;

  function label(app) { return app.name ?? app.id; }

  function renderList() {
    $("list").replaceChildren(...apps.map((app) => {
      const button = document.createElement("button");
      button.type = "button";
      button.dataset.id = app.id;
      button.setAttribute("aria-current", String(app.id === selected));
      const name = document.createElement("strong");
      name.textContent = label(app);
      button.append(name);
      if (app.description) {
        const description = document.createElement("span");
        description.textContent = app.description;
        button.append(description);
      }
      button.addEventListener("click", () => select(app.id));
      return button;
    }));
  }

  async function select(id) {
    if (!apps.some((app) => app.id === id)) return;
    selected = id;
    history.replaceState(null, "", `#${id}`);
    renderList();
    await fetch(`/api/start/${encodeURIComponent(id)}`, { method: "POST" });
    refresh();
  }

  function render(state) {
    const app = apps.find((candidate) => candidate.id === selected);
    const run = state.current && state.current.id === selected ? state.current : null;
    $("title").textContent = app ? label(app) : "Pick an app";
    $("status").hidden = !run;
    if (run) { $("status").className = `pill ${run.status}`; $("status").textContent = STATUS_TEXT[run.status] ?? run.status; }
    $("demo").hidden = !app?.demo;
    if (app?.demo) $("demo").href = app.demo;

    const url = run && `http://localhost:${run.port}/`;
    const ready = run?.status === "ready";
    $("open").hidden = !ready;
    if (ready) {
      $("open").href = url;
      if ($("frame").dataset.url !== url) { $("frame").dataset.url = url; $("frame").src = url; }
    } else if ($("frame").dataset.url) {
      delete $("frame").dataset.url;
      $("frame").removeAttribute("src");
    }

    $("overlay").hidden = ready;
    $("retry").hidden = run?.status !== "error";
    $("log").hidden = !run || run.log.length === 0 || run.status === "ready";
    $("log").textContent = run ? run.log.join("\n") : "";
    if (!app) $("message").textContent = "Choose an app on the left. It starts on demand; the first load takes a few seconds.";
    else if (!run) $("message").textContent = `Starting ${label(app)}...`;
    else if (run.status === "error") $("message").textContent = `${label(app)} failed: ${run.error}`;
    else if (!ready) $("message").textContent = `${STATUS_TEXT[run.status]} ${label(app)}...`;
  }

  let timer = null;
  async function refresh() {
    clearTimeout(timer);
    let state;
    try {
      state = await (await fetch("/api/state")).json();
    } catch {
      $("message").textContent = "The switcher server is not responding. Restart it with npm start.";
      $("overlay").hidden = false;
      timer = setTimeout(refresh, 3000);
      return;
    }
    if (apps.length === 0) {
      apps = state.apps;
      $("summary").textContent = `${apps.length} Square UI apps (Base UI). One runs at a time.`;
      renderList();
    }
    render(state);
    const busy = state.current && ["installing", "starting"].includes(state.current.status);
    timer = setTimeout(refresh, busy ? 1000 : 5000);
  }

  $("retry").addEventListener("click", () => select(selected));
  document.addEventListener("keydown", (event) => {
    if (!["ArrowDown", "ArrowUp"].includes(event.key) || apps.length === 0) return;
    event.preventDefault();
    const index = apps.findIndex((app) => app.id === selected);
    const next = event.key === "ArrowDown" ? Math.min(apps.length - 1, index + 1) : Math.max(0, index - 1);
    select(apps[next].id);
  });

  refresh().then(() => { const id = location.hash.slice(1); if (id) select(id); });
</script>
</body>
</html>
