<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Template Switcher</title>
<style>
  :root {
    --bg: #f7f7f8; --panel: #ffffff; --text: #18181b; --muted: #71717a; --border: #e4e4e7;
    --accent: #2540e8; --ok: #15803d; --warn: #b45309; --bad: #b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0b0d; --panel: #141417; --text: #f4f4f5; --muted: #a1a1aa; --border: #27272a;
      --accent: #8b9bff; --ok: #4ade80; --warn: #fbbf24; --bad: #f87171;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; grid-template-rows: auto 1fr; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .bar {
    display: flex; align-items: center; gap: 12px; padding: 8px 16px; min-width: 0;
    border-bottom: 1px solid var(--border); background: var(--panel);
  }
  select {
    font: inherit; font-weight: 600; color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; min-width: 220px;
  }
  .description {
    flex: 1; min-width: 0; color: var(--muted); font-size: 13px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .bar a { color: var(--accent); font-size: 13px; text-decoration: none; white-space: nowrap; }
  .bar a:hover { text-decoration: underline; }
  .pill { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
  .pill.ready { color: var(--ok); } .pill.starting, .pill.installing { color: var(--warn); }
  .pill.error { color: var(--bad); }
  .stage { position: relative; min-height: 0; }
  iframe { width: 100%; height: 100%; border: 0; background: var(--panel); display: block; }
  .overlay {
    position: absolute; inset: 0; display: grid; place-content: center; gap: 12px; padding: 24px;
    background: var(--bg); text-align: center;
  }
  .overlay[hidden] { display: none; }
  .overlay pre {
    text-align: left; max-width: 760px; max-height: 40vh; overflow: auto; margin: 0; padding: 12px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px; font-size: 12px;
    white-space: pre-wrap;
  }
  .overlay button {
    justify-self: center; font: inherit; padding: 6px 14px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
  }
  @media (max-width: 720px) {
    .bar { flex-wrap: wrap; }
    select { flex: 1; min-width: 0; }
    .description { flex-basis: 100%; order: 5; }
  }
</style>
</head>
<body>
<div class="bar">
  <select id="picker" aria-label="App">
    <option value="">Loading apps...</option>
  </select>
  <span id="status" class="pill" hidden></span>
  <span id="description" class="description"></span>
  <a id="open" target="_blank" rel="noopener" hidden>Open in new tab</a>
  <a id="demo" target="_blank" rel="noopener" hidden>Hosted demo</a>
</div>
<div class="stage">
  <iframe id="frame" title="Selected app"></iframe>
  <div id="overlay" class="overlay">
    <div id="message">Pick an app from the list at the top. It starts on demand; the first load takes a few seconds.</div>
    <pre id="log" hidden></pre>
    <button id="retry" type="button" hidden>Retry</button>
  </div>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  const STATUS_TEXT = { installing: "Installing dependencies", starting: "Starting", ready: "Running", error: "Failed" };
  const IDLE_MESSAGE = "Pick an app from the list at the top. It starts on demand; the first load takes a few seconds.";
  let apps = [];
  let selected = null;

  function label(app) { return app.name ?? app.id; }

  function renderPicker() {
    const placeholder = new Option(`Pick one of ${apps.length} apps`, "");
    placeholder.disabled = true;
    $("picker").replaceChildren(placeholder, ...apps.map((app) => new Option(label(app), app.id)));
    $("picker").value = selected ?? "";
  }

  async function select(id) {
    if (!apps.some((app) => app.id === id)) return;
    selected = id;
    $("picker").value = id;
    history.replaceState(null, "", `#${id}`);
    render({ current: null });
    await fetch(`/api/start/${encodeURIComponent(id)}`, { method: "POST" });
    refresh();
  }

  function render(state) {
    const app = apps.find((candidate) => candidate.id === selected);
    const run = state.current && state.current.id === selected ? state.current : null;
    $("description").textContent = app?.description ?? "";
    $("status").hidden = !run;
    if (run) { $("status").className = `pill ${run.status}`; $("status").textContent = STATUS_TEXT[run.status] ?? run.status; }
    $("demo").hidden = !app?.demo;
    if (app?.demo) $("demo").href = app.demo;

    const url = run && `http://localhost:${run.port}/`;
    const ready = run?.status === "ready";
    $("open").hidden = !ready;
    if (ready) {
      $("open").href = url;
      if ($("frame").dataset.url !== url) { $("frame").dataset.url = url; $("frame").src = url; }
    } else if ($("frame").dataset.url) {
      delete $("frame").dataset.url;
      $("frame").removeAttribute("src");
    }

    $("overlay").hidden = ready;
    $("retry").hidden = run?.status !== "error";
    $("log").hidden = !run || run.log.length === 0 || run.status === "ready";
    $("log").textContent = run ? run.log.join("\n") : "";
    if (!app) $("message").textContent = IDLE_MESSAGE;
    else if (!run) $("message").textContent = `Starting ${label(app)}...`;
    else if (run.status === "error") $("message").textContent = `${label(app)} failed: ${run.error}`;
    else if (!ready) $("message").textContent = `${STATUS_TEXT[run.status]} ${label(app)}...`;
  }

  let timer = null;
  async function refresh() {
    clearTimeout(timer);
    let state;
    try {
      state = await (await fetch("/api/state")).json();
    } catch {
      $("message").textContent = "The switcher server is not responding. Restart it with npm start.";
      $("overlay").hidden = false;
      timer = setTimeout(refresh, 3000);
      return;
    }
    if (apps.length === 0) {
      apps = state.apps;
      renderPicker();
    }
    render(state);
    const busy = state.current && ["installing", "starting"].includes(state.current.status);
    timer = setTimeout(refresh, busy ? 1000 : 5000);
  }

  $("picker").addEventListener("change", (event) => select(event.target.value));
  $("retry").addEventListener("click", () => select(selected));

  refresh().then(() => { const id = location.hash.slice(1); if (id) select(id); });
</script>
</body>
</html>
